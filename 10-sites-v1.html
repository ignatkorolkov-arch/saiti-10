.btn{display:inline-block;border:0;cursor:pointer;background:var(--ac);color:var(--ai);font:700 15px var(--bf);padding:14px 26px;border-radius:var(--r);transition:transform .15s,box-shadow .15s;text-decoration:none}

.sh nav a{text-decoration:none;opacity:.75}.sh nav a:hover{opacity:1}
.tel{font-weight:700;text-decoration:none;white-space:nowrap}

.art{display:grid;place-items:center;min-height:300px}

.pt{position:absolute;top:-30px;animation:fa linear infinite;opacity:.8;pointer-events:none}
